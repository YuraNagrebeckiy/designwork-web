<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#5265df"><title>Design Studio</title><link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#202633;--muted:#667085;--line:#e0e4ec;--accent:#5265df;--soft:#e9edff;--danger:#c33347;--logo-line:#cfcfcf}html[data-theme=dark]{--bg:#15171d;--panel:#20242d;--ink:#edf0f7;--muted:#a8b1c4;--line:#373e4d;--soft:#303958;--accent:#8e9dff;--danger:#ff8696;--logo-line:#5b6070}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif;padding-bottom:env(safe-area-inset-bottom)}button,input,select{font:inherit}button{cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 13px;min-height:44px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:transparent}button.danger{color:var(--danger)}input,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}select[multiple]{min-height:120px}label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}label.check{display:flex;align-items:center;gap:10px}label.check input{width:auto;min-height:24px}h1{font-size:24px;margin:0}h2{font-size:19px}p{margin:8px 0}.muted,small{color:var(--muted)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:48px;flex:none}.authlogo{width:92px;height:105px;display:block;margin:0 auto 8px}nav{display:flex;gap:7px;flex-wrap:wrap}.active{background:var(--soft);border-color:var(--accent)}main{max-width:1450px;margin:auto;padding:22px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar select{width:auto;max-width:100%}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.card{margin:9px 0}.card h3{font-size:15px;margin:0 0 8px;overflow-wrap:anywhere}.card .meta{font-size:12px;color:var(--muted)}.card .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;background:var(--soft);border-radius:6px;padding:2px 7px;font-size:12px}.board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:16px;align-items:start}.column{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;min-height:160px}.column h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.auth{max-width:430px;margin:6vh auto}.auth form{margin:16px 0}.auth button{margin-top:12px}.auth details{margin-top:14px}.hidden{display:none!important}.error{color:var(--danger);overflow-wrap:anywhere}.notice{color:var(--muted);font-size:13px}.overdue{border-left:4px solid var(--danger)}#message{position:fixed;left:16px;right:16px;bottom:16px;max-width:700px;margin:auto;z-index:100;background:var(--ink);color:var(--panel);padding:14px 18px;border-radius:10px;white-space:pre-wrap;box-shadow:0 4px 28px #0004}#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:200;opacity:0;transition:opacity .2s}body.loading #bar{opacity:1;width:80%;transition:width 10s cubic-bezier(.1,.7,.2,1),opacity .2s}dialog{max-width:620px;width:calc(100% - 24px);max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:22px}dialog::backdrop{background:#0008}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}.gantt-scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:70dvh}.gantt{position:relative;isolation:isolate}.grow{display:flex;height:58px;border-bottom:1px solid var(--line);position:relative}.ghead{height:42px;position:sticky;top:0;z-index:5;background:var(--panel)}.glabel{flex:0 0 230px;width:230px;position:sticky;left:0;background:var(--panel);border-right:1px solid var(--line);padding:8px 12px;z-index:3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.glabel small{display:block}.track{position:relative;height:100%;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:28px 100%}.day{position:absolute;top:0;width:28px;font-size:10px;text-align:center;padding-top:4px;color:var(--muted)}.bar{position:absolute;top:16px;height:26px;min-height:26px;border:0;border-radius:5px;padding:0 5px;background:#6574db;color:white;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2}.bar.done{background:#29946f}.bar.pause{background:#ad8434}.todayline{position:absolute;top:42px;bottom:0;border-left:2px solid #e26c69;z-index:1;pointer-events:none}.depsvg{position:absolute;top:42px;left:230px;pointer-events:none;z-index:1}.empty{padding:30px;color:var(--muted)}@media(max-width:760px){header{padding:10px 12px}main{padding:12px}.board{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.glabel{flex-basis:160px;width:160px}.depsvg{left:160px}h1{font-size:20px}.toolbar>*{flex-grow:1}.toolbar select{width:100%}}
</style></head><body>
<div id="bar"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="345 100 315 360"><g fill="none" stroke="var(--logo-line)" stroke-width="3" stroke-linejoin="round"><path d="M502 105L570.5 143.5V226L502 265L433.5 226V143.5ZM433.5 143.5L502 181L570.5 143.5M502 181V265"/><path d="M420 152L488.5 190.5V273L420 312L351.5 273V190.5ZM351.5 190.5L420 228L488.5 190.5M420 228V312"/><path d="M585 152L653.5 190.5V273L585 312L516.5 273V190.5ZM516.5 190.5L585 228L653.5 190.5M585 228V312"/><path d="M420 251L488.5 289.5V372L420 411L351.5 372V289.5ZM351.5 289.5L420 327L488.5 289.5M420 327V411"/><path d="M585 251L653.5 289.5V372L585 411L516.5 372V289.5ZM516.5 289.5L585 327L653.5 289.5M585 327V411"/><path d="M502 294L570.5 332.5V415L502 454L433.5 415V332.5ZM433.5 332.5L502 370L570.5 332.5M502 370V454"/></g><polygon points="502,196 570,235 502,272 433,235" fill="#66120F"/><polygon points="433,235 502,272 502,356 433,318" fill="#991720"/><polygon points="502,272 570,235 570,318 502,356" fill="#7D1416"/></symbol></svg>
<header><div class="brand"><svg class="logo" aria-label="Логотип"><use href="#logo"/></svg><div><h1>Design Studio</h1><small id="identity">Проекты дизайн-студии</small></div></div><nav id="nav"></nav><div><button id="pwbtn" class="hidden">Пароль</button> <button id="theme" aria-label="Сменить тему">Тема</button> <button id="logout" class="hidden">Выйти</button></div></header>
<main><section id="auth" class="auth panel"><svg class="authlogo" aria-hidden="true"><use href="#logo"/></svg><h2>Вход</h2><form id="passform"><label>Email<input id="email" type="email" autocomplete="username" required maxlength="200"></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required maxlength="100"></label><button class="primary" type="submit">Войти</button></form><details><summary>Первый вход или забыли пароль</summary><p class="notice">Введите email выше и нажмите «Получить код». Код придёт на почту. После входа по коду приложение предложит задать пароль.</p><button id="sendcode" type="button">Получить код</button><form id="codeform"><label>Код из письма<input id="code" autocomplete="one-time-code" required maxlength="10" placeholder="10 символов"></label><button class="primary" type="submit">Войти по коду</button></form></details><details><summary>Подать заявку на доступ</summary><form id="regform"><label>Имя<input id="regname" required maxlength="100"></label><label>Email<input id="regemail" type="email" required maxlength="200"></label><button type="submit">Зарегистрироваться</button></form></details></section><section id="content" class="hidden"></section></main>
<dialog id="dialog"><form id="editform"></form></dialog><div id="message" class="hidden" role="status"></div>
<script src="config.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), statuses=['В работе','Пауза','Готово'];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token='',state=null,view='tasks',projectId='',period='all',filterProject='',modalSubmit=null,working=false,asked=false,pending=0;
try{token=localStorage.getItem('studioToken')||'';document.documentElement.dataset.theme=localStorage.getItem('studioTheme')||'light';}catch(e){}
function toast(s){$('message').textContent=s;$('message').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('message').classList.add('hidden'),7500);}
async function transport(req){
 const API=String(window.STUDIO_API||'').trim();
 if(!API.startsWith('https://script.google.com/macros/s/')||!API.endsWith('/exec'))throw Error('Не настроен адрес сервера (config.js)');
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
 try{
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req),signal:ctl.signal,redirect:'follow'});
  if(!res.ok)throw Error('Сервер недоступен ('+res.status+')');
  return await res.json();
 }catch(e){
  throw Error(e.name==='AbortError'?'Сервер отвечает слишком долго. Повторите.':'Нет связи с сервером. '+(e.message||''));
 }finally{clearTimeout(to);}
}
async function call(action,payload={}){const r=await transport({action,payload,token});if(!r.ok){if(String(r.error).startsWith('AUTH:'))signoutLocal();throw Error(r.error);}return r.data;}
async function guarded(fn,silent){
 if(!silent){if(working)return;working=true;}
 pending++;document.body.classList.add('loading');
 try{await fn();}catch(e){if(!silent||!document.hidden)toast(e.message||String(e));}
 finally{pending--;if(!pending)document.body.classList.remove('loading');if(!silent)working=false;}
}
function signoutLocal(){token='';state=null;asked=false;try{localStorage.removeItem('studioToken');localStorage.removeItem('studioCache');}catch(e){}$('auth').classList.remove('hidden');$('content').classList.add('hidden');$('logout').classList.add('hidden');$('pwbtn').classList.add('hidden');$('nav').innerHTML='';$('identity').textContent='Проекты дизайн-студии';if($('dialog').open)$('dialog').close();}
function applyState(s){state=s;$('auth').classList.add('hidden');$('content').classList.remove('hidden');$('logout').classList.remove('hidden');$('pwbtn').classList.remove('hidden');$('identity').textContent=state.me.name+' • '+({admin:'Руководитель',employee:'Сотрудник',observer:'Наблюдатель'}[state.me.role]);if(state.me.role==='observer'&&view==='tasks')view='projects';render();if(state.hasPassword===false&&!asked){asked=true;passwordForm();}}
async function reload(){const s=await call('state');if(!token)return;applyState(s);try{localStorage.setItem('studioCache',JSON.stringify(s));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function plus(d,n){return new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);}
function days(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000);}
function name(id){return state.users.find(u=>u.id===id)?.name||'Не назначен';}
function projectName(id){return state.projects.find(p=>p.id===id)?.name||'';}
function arr(s){try{return JSON.parse(s||'[]');}catch(e){return [];}}
function opts(items,selected){return items.map(x=>`<option value="${esc(x.id)}" ${Array.isArray(selected)?selected.includes(x.id)?'selected':'':x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('');}
function admin(){return state.me.role==='admin';}
function canEdit(t){return admin()||(state.me.role==='employee'&&t.assigneeId===state.me.id);}
function card(t){return `<article class="card ${t.end<today()&&t.status!=='Готово'?'overdue':''}" ${canEdit(t)?'draggable="true"':''} data-drag="${esc(t.id)}"><h3>${t.parentId?'↳ ':''}${esc(t.title)}</h3><div class="meta">${esc(projectName(t.projectId))}<br>${esc(name(t.assigneeId))} • ${esc(t.start)} — ${esc(t.end)}</div>${t.syncError?`<p class="error"><small>${esc(t.syncError)}</small></p>`:t.dirty==='true'?'<p class="notice">Календарь: ожидает синхронизации</p>':''}<div class="actions">${canEdit(t)?`<button data-action="taskEdit" data-id="${esc(t.id)}">Изменить</button><button data-action="subtask" data-id="${esc(t.id)}">+ Подзадача</button>`:''}</div></article>`;}
function render(){const tabs=state.me.role==='observer'?[['projects','Объекты']]:[['tasks','Мои задачи'],['projects','Объекты'],...(admin()?[['users','Команда']]:[])];$('nav').innerHTML=tabs.map(([id,title])=>`<button data-view="${id}" class="${view===id?'active':''}">${title}</button>`).join('');if(view==='tasks')renderTasks();else if(view==='users'&&admin())renderUsers();else renderProjects();}
function renderTasks(){let tasks=state.tasks.filter(t=>!admin()||t.assigneeId===state.me.id);if(filterProject)tasks=tasks.filter(t=>t.projectId===filterProject);if(period!=='all'){const end=period==='today'?today():plus(today(),6);tasks=tasks.filter(t=>t.start<=end&&t.end>=today());}tasks.sort((a,b)=>a.end.localeCompare(b.end));$('content').innerHTML=`<div class="toolbar"><select id="period" aria-label="Период">${[['all','Все мои задачи'],['today','На сегодня'],['week','Ближайшие 7 дней']].map(([v,l])=>`<option value="${v}" ${v===period?'selected':''}>${l}</option>`).join('')}</select><select id="filterProject" aria-label="Объект"><option value="">Все объекты</option>${opts(state.projects,filterProject)}</select><button data-action="refresh">Обновить</button></div><div class="board">${statuses.map(s=>`<section class="column" data-drop="${s}"><h2>${s} <small>${tasks.filter(t=>t.status===s).length}</small></h2>${tasks.filter(t=>t.status===s).map(card).join('')||'<p class="notice">Нет задач</p>'}</section>`).join('')}</div><p class="notice">На компьютере карточки можно переносить между колонками. На телефоне используйте «Изменить».</p>`;}
function renderProjects(){if(projectId&&!state.projects.some(p=>p.id===projectId))projectId='';const p=state.projects.find(p=>p.id===projectId);$('content').innerHTML=`<div class="toolbar"><select id="projectSelect" aria-label="Выберите объект"><option value="">Все объекты</option>${opts(state.projects,projectId)}</select>${admin()?'<button class="primary" data-action="projectCreate">+ Объект</button>':''}<button data-action="refresh">Обновить</button>${p&&admin()?'<button data-action="projectEdit">Настройки объекта</button><button data-action="taskCreate">+ Задача</button>':''}</div>${p?`<h2>${esc(p.name)}</h2><p class="notice">Связи: окончание → старт, календарные дни. ${state.me.role==='employee'?'Показаны только ваши задачи.':''}</p><div id="ganttRoot"></div><div class="grid">${state.tasks.filter(t=>t.projectId===p.id).map(card).join('')}</div>`:`<div class="grid">${state.projects.map(x=>{const tasks=state.tasks.filter(t=>t.projectId===x.id);return `<article class="panel"><h2>${esc(x.name)}</h2><p class="muted">${tasks.filter(t=>t.status==='Готово').length} / ${tasks.length} задач готовы</p><button data-action="openProject" data-id="${esc(x.id)}">Открыть график</button></article>`;}).join('')||'<p class="empty">Нет доступных объектов.</p>'}</div>`}`;if(p)renderGantt(p.id);}
function renderGantt(id){const ts=state.tasks.filter(t=>t.projectId===id).sort((a,b)=>a.start.localeCompare(b.start));if(!ts.length){$('ganttRoot').innerHTML='<p class="empty">Нет задач</p>';return;}let min=ts.reduce((a,t)=>t.start<a?t.start:a,ts[0].start),max=ts.reduce((a,t)=>t.end>a?t.end:a,ts[0].end);min=plus(min,-1);max=plus(max,2);const n=days(min,max)+1,w=n*28;const shown=ts.slice(0,500);let ticks='';for(let i=0;i<n;i++){if(n>1500&&i%7)continue;const d=plus(min,i);ticks+=`<span class="day" style="left:${i*28}px">${d.slice(8)}<br>${d.slice(5,7)}</span>`;}let paths='';shown.forEach((t,i)=>arr(t.deps).forEach(id=>{const j=shown.findIndex(x=>x.id===id);if(j<0)return;const x1=(days(min,shown[j].end)+1)*28,x2=days(min,t.start)*28,y1=j*58+29,y2=i*58+29;paths+=`<path d="M ${x1} ${y1} H ${x1+8} V ${y2} H ${x2}" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>`;}));const labelWidth=matchMedia('(max-width:760px)').matches?160:230;$('ganttRoot').innerHTML=`<div class="gantt-scroll"><div class="gantt" style="width:${w+labelWidth}px"><div class="grow ghead"><div class="glabel">Этап / исполнитель</div><div class="track" style="width:${w}px">${ticks}</div></div>${shown.map(t=>`<div class="grow"><div class="glabel" title="${esc(t.title)}">${esc(t.title)}<small>${esc(name(t.assigneeId))}</small></div><div class="track" style="width:${w}px"><button class="bar ${t.status==='Готово'?'done':t.status==='Пауза'?'pause':''}" style="left:${days(min,t.start)*28}px;width:${(days(t.start,t.end)+1)*28}px" data-action="taskEdit" data-id="${esc(t.id)}" title="${esc(t.start+' — '+t.end+' • '+t.title)}">${esc(t.title)}</button></div></div>`).join('')}<svg class="depsvg" width="${w}" height="${shown.length*58}" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/></marker></defs>${paths}</svg>${today()>=min&&today()<=max?`<div class="todayline" style="left:${labelWidth+days(min,today())*28}px"></div>`:''}</div></div><p class="notice">${esc(min)} — ${esc(max)}. Прокрутка по горизонтали. ${ts.length>500?'Отображены первые 500 строк.':''}</p>`;}
function renderUsers(){$('content').innerHTML=`<div class="toolbar"><h2>Команда и заявки</h2><button data-action="refresh">Обновить</button></div><div class="grid">${state.users.map(u=>`<article class="panel"><h2>${esc(u.name)}</h2><p>${esc(u.email)}</p><p><span class="badge">${esc(u.role)}</span> ${u.approved==='true'?'Доступ открыт':'Ожидает подтверждения'}</p><p class="notice">Календарь: ${esc(u.calendarId||'не задан')}</p><button data-action="userEdit" data-id="${esc(u.id)}">Настроить доступ</button></article>`).join('')}</div>`;}
function showForm(body,submit){$('editform').innerHTML=body+'<div class="footer"><button type="button" data-action="close">Отмена</button><button class="primary" type="submit">Сохранить</button></div>';modalSubmit=submit;$('dialog').showModal();}
function input(label,id,value,type='text',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function selected(id){return [...$(id).selectedOptions].map(o=>o.value);}
function passwordForm(){showForm(`<h2>Пароль для входа</h2><p class="notice">От 8 символов, лучше длиннее. Дальше вы будете входить по email и паролю.</p><label>Новый пароль<input id="pw1" type="password" autocomplete="new-password" required minlength="8" maxlength="100"></label><label>Повторите пароль<input id="pw2" type="password" autocomplete="new-password" required minlength="8" maxlength="100"></label>`,async()=>{if($('pw1').value!==$('pw2').value)throw Error('Пароли не совпадают');await call('setPassword',{password:$('pw1').value});state.hasPassword=true;$('dialog').close();toast('Пароль сохранён');});}
function taskForm(t,parent){const create=!t,editable=admin()||create;const project=t?.projectId||parent?.projectId||projectId;const start=t?.start||parent?.start||today(),end=t?.end||parent?.end||start;
 if(t&&!canEdit(t)){toast(t.title+'\n'+t.start+' — '+t.end+' • '+t.status);return;}
 const available=state.tasks.filter(x=>x.projectId===project&&x.id!==t?.id);showForm(`<h2>${create?parent?'Личная подзадача':'Новая задача':'Задача'}</h2>${editable?input('Название','f_title',t?.title||'','text','required maxlength="200"')+`<div class="formgrid">${input('Начало','f_start',start,'date','required')}${input('Дедлайн включительно','f_end',end,'date','required')}</div>`:''}${admin()?`<label>Исполнитель<select id="f_assignee"><option value="">Не назначен</option>${opts(state.users.filter(u=>u.approved==='true'&&u.role!=='observer'),t?.assigneeId||parent?.assigneeId||'')}</select></label><label>Предшественники<select multiple id="f_deps">${opts(available.map(x=>({id:x.id,name:x.title})),arr(t?.deps))}</select></label><small>На компьютере Ctrl/Cmd для нескольких связей.</small>${input('Задержка после предшественников, дней','f_lag',t?.lag||0,'number','min="0" max="3650" step="1"')}`:''}${!create?`<label>Статус<select id="f_status">${statuses.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></label>`:''}${editable?`<label class="check"><input type="checkbox" id="f_calendar" ${!t||t.calendarEnabled==='true'?'checked':''}>Создать событие в календаре</label>`:''}${admin()&&t?`<button type="button" class="danger" data-action="taskDelete" data-id="${esc(t.id)}">Удалить задачу</button>`:''}`,async()=>{let p={};if(editable)p={title:$('f_title').value,start:$('f_start').value,end:$('f_end').value,calendarEnabled:$('f_calendar').checked};if(admin())Object.assign(p,{assigneeId:$('f_assignee').value,deps:selected('f_deps'),lag:$('f_lag').value});if(create)Object.assign(p,{projectId:project,parentId:parent?.id||''});else Object.assign(p,{id:t.id,version:t.version,status:$('f_status').value});await call(create?'taskCreate':'taskUpdate',p);$('dialog').close();await reload();});}
function projectForm(p){const observers=state.users.filter(u=>u.role==='observer'&&u.approved==='true'),templates=[...new Set(state.templates.map(t=>t.templateId))];showForm(`<h2>${p?'Настройки объекта':'Объект по шаблону'}</h2>${input('Название объекта','p_name',p?.name||'','text','required maxlength="160"')}${!p?`${input('Дата старта','p_start',today(),'date','required')}<label>Шаблон<select id="p_template">${templates.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label>Первоначальный исполнитель всех этапов<select id="p_assignee"><option value="">Назначить позже</option>${opts(state.users.filter(u=>u.approved==='true'&&u.role!=='observer'),'')}</select></label>`:''}<label>Наблюдатели объекта<select multiple id="p_viewers">${opts(observers,arr(p?.viewers))}</select></label><small>Наблюдатель увидит все задачи и ответственных в этом объекте.</small>${p?`<p><button type="button" class="danger" data-action="projectDelete" data-id="${esc(p.id)}">Удалить объект и его задачи</button></p>`:''}`,async()=>{let payload={name:$('p_name').value,viewers:selected('p_viewers')};if(p)Object.assign(payload,{id:p.id,version:p.version});else Object.assign(payload,{start:$('p_start').value,templateId:$('p_template').value,assigneeId:$('p_assignee').value});const id=await call(p?'projectUpdate':'projectCreate',payload);if(!p)projectId=id;$('dialog').close();await reload();});}
function userForm(u){showForm(`<h2>Доступ пользователя</h2><p>${esc(u.email)}</p>${input('Имя','u_name',u.name,'text','required maxlength="100"')}<label>Роль<select id="u_role">${[['admin','Админ'],['employee','Сотрудник'],['observer','Наблюдатель']].map(([v,l])=>`<option value="${v}" ${u.role===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="check"><input id="u_approved" type="checkbox" ${u.approved==='true'?'checked':''}>Доступ одобрен</label>${input('ID календаря (не ссылка)','u_calendar',u.calendarId||'')}<p class="notice">Календарь должен быть добавлен в Google Календарь владельца скрипта с правом изменения событий. Разные сотрудники — разные календарные ID.</p>`,async()=>{await call('userSave',{id:u.id,name:$('u_name').value,role:$('u_role').value,approved:$('u_approved').checked,calendarId:$('u_calendar').value});$('dialog').close();await reload();});}
async function changeStatus(t,s){await call('taskUpdate',{...t,status:s,deps:arr(t.deps)});await reload();}
$('theme').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('studioTheme',theme);}catch(e){}};
$('pwbtn').onclick=()=>passwordForm();
$('logout').onclick=()=>guarded(async()=>{try{await call('logout');}finally{signoutLocal();}});
$('passform').onsubmit=e=>{e.preventDefault();guarded(async()=>{const r=await call('login',{email:$('email').value,password:$('password').value});token=r.token;$('password').value='';try{localStorage.setItem('studioToken',token);}catch(e){}await reload();});};
$('sendcode').onclick=()=>guarded(async()=>toast((await call('requestCode',{email:$('email').value})).message));
$('codeform').onsubmit=e=>{e.preventDefault();guarded(async()=>{const r=await call('verifyCode',{email:$('email').value,code:$('code').value});token=r.token;$('code').value='';try{localStorage.setItem('studioToken',token);}catch(e){}await reload();});};
$('regform').onsubmit=e=>{e.preventDefault();guarded(async()=>toast((await call('register',{email:$('regemail').value,name:$('regname').value})).message));};
$('editform').onsubmit=e=>{e.preventDefault();guarded(()=>modalSubmit());};
document.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;render();}if(e.target.id==='filterProject'){filterProject=e.target.value;render();}if(e.target.id==='projectSelect'){projectId=e.target.value;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return;}const a=b.dataset.action,id=b.dataset.id;if(!a)return;if(a==='close'){$('dialog').close();return;}if(a==='refresh'){guarded(reload);return;}if(a==='openProject'){projectId=id;render();return;}if(a==='projectCreate'){projectForm(null);return;}if(a==='projectEdit'){projectForm(state.projects.find(p=>p.id===projectId));return;}if(a==='taskCreate'){taskForm(null,null);return;}if(a==='taskEdit'){taskForm(state.tasks.find(t=>t.id===id));return;}if(a==='subtask'){taskForm(null,state.tasks.find(t=>t.id===id));return;}if(a==='userEdit'){userForm(state.users.find(u=>u.id===id));return;}if(a==='taskDelete'&&confirm('Удалить задачу? Событие будет удалено очередным запуском синхронизации.')){guarded(async()=>{const t=state.tasks.find(t=>t.id===id);await call('taskDelete',{id,version:t.version});$('dialog').close();await reload();});}if(a==='projectDelete'&&confirm('Удалить объект, все его задачи и связанные события?')){guarded(async()=>{const p=state.projects.find(p=>p.id===id);await call('projectDelete',{id,version:p.version});projectId='';$('dialog').close();await reload();});}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]');if(c)e.dataTransfer.setData('text/plain',c.dataset.drag);});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drop]'))e.preventDefault();});document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop]');if(!col)return;e.preventDefault();const t=state.tasks.find(t=>t.id===e.dataTransfer.getData('text/plain'));if(t&&canEdit(t))guarded(()=>changeStatus(t,col.dataset.drop));});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state&&view==='projects'&&projectId&&!$('dialog').open)render();},200);});
setInterval(()=>{if(state&&!document.hidden&&!working&&!$('dialog').open)guarded(reload,true);},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&!working&&!$('dialog').open)guarded(reload,true);});
if(token){try{const c=JSON.parse(localStorage.getItem('studioCache')||'null');if(c&&c.me&&c.projects)applyState(c);}catch(e){}guarded(reload,true);}
</script></body></html>
